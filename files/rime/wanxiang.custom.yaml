patch:
  custom_phrase/dictionary: wanxiang_personal_phrase
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: commit_code
      Control_L: noop
      Control_R: noop
      Shift_L: commit_code
      Shift_R: inline_ascii
  menu/page_size: 6
  super_sequence:
    up: Control+Alt+j
    down: Control+Alt+k
    reset: Control+Alt+l
    pin: Control+Alt+p
  key_binder/import_preset: null
  key_binder/bindings:
  - accept: Control+p
    send: Up
    when: composing
  - accept: Control+n
    send: Down
    when: composing
  - accept: Control+b
    send: Left
    when: composing
  - accept: Control+f
    send: Right
    when: composing
  - accept: Control+a
    send: Home
    when: composing
  - accept: Control+e
    send: End
    when: composing
  - accept: Control+d
    send: Delete
    when: composing
  - accept: Control+k
    send: Shift+Delete
    when: composing
  - accept: Control+g
    send: Escape
    when: composing
  - accept: Alt+v
    send: Page_Up
    when: composing
  - accept: Control+v
    send: Page_Down
    when: composing
  - accept: ISO_Left_Tab
    send: Shift+Left
    when: composing
  - accept: Shift+Tab
    send: Shift+Left
    when: composing
  - accept: Tab
    send: Shift+Right
    when: composing
  - accept: minus
    send: Page_Up
    when: paging
  - accept: equal
    send: Page_Down
    when: has_menu
  - accept: comma
    send: Page_Up
    when: paging
  - accept: period
    send: Page_Down
    when: has_menu
  - accept: comma
    send: comma
    when: predicting
  - accept: period
    send: period
    when: predicting
  - accept: Control+Shift+1
    select: .next
    when: always
  - accept: Control+Shift+2
    toggle: ascii_mode
    when: always
  - accept: Control+Shift+3
    toggle: full_shape
    when: always
  - accept: Control+Shift+4
    toggle: s2t
    when: always
  - accept: Control+Shift+5
    toggle: charset_filter
    when: always
  - accept: Shift+space
    toggle: full_shape
    when: always
  - accept: Control+period
    toggle: ascii_punct
    when: always
  - accept: KP_0
    send: 0
    when: composing
  - accept: KP_1
    send: 1
    when: composing
  - accept: KP_2
    send: 2
    when: composing
  - accept: KP_3
    send: 3
    when: composing
  - accept: KP_4
    send: 4
    when: composing
  - accept: KP_5
    send: 5
    when: composing
  - accept: KP_6
    send: 6
    when: composing
  - accept: KP_7
    send: 7
    when: composing
  - accept: KP_8
    send: 8
    when: composing
  - accept: KP_9
    send: 9
    when: composing
  - accept: KP_Decimal
    send: period
    when: composing
  - accept: KP_Multiply
    send: asterisk
    when: composing
  - accept: KP_Add
    send: plus
    when: composing
  - accept: KP_Subtract
    send: minus
    when: composing
  - accept: KP_Divide
    send: slash
    when: composing
  - accept: KP_Enter
    send: Return
    when: composing
  - accept: Control+Shift+E
    toggle: emoji
    when: always
  - accept: Control+Shift+exclam
    toggle: s2t
    when: has_menu
  punctuator/half_shape:
    '!':
      commit: ！
    '"':
      pair:
      - “
      - ”
    '#': '#'
    $:
    - ¥
    - $
    - €
    - £
    - ¢
    - ¤
    '%':
    - '%'
    - ％
    - °
    - ℃
    - ‰
    - ‱
    - ℉
    - ℅
    - ℆
    - ℀
    - ℁
    - ⅍
    '&': '&'
    '''':
      pair:
      - 「
      - 」
    (: （
    ): ）
    '*': '*'
    +: +
    ',':
      commit: ，
    '-': '-'
    .:
      commit: 。
    /:
    - /
    - ÷
    ':':
      commit: ：
    ;:
      commit: ；
    <:
    - 《
    - 〈
    - «
    - <
    '=': '='
    '>':
    - 》
    - 〉
    - »
    - '>'
    '?':
      commit: ？
    '@': '@'
    '[':
    - 【
    - '['
    \: 、
    ']':
    - 】
    - ']'
    ^:
      commit: ……
    _: ──
    '`': '`'
    '{':
    - 『
    - 〖
    - ｛
    '|':
    - ·
    - ・
    - '|'
    - ｜
    - §
    - ¦
    - ‖
    '}':
    - 』
    - 〗
    - ｝
    '~': '~'
  punctuator/full_shape:
    ' ':
      commit: 　
    '!':
      commit: ！
    '"':
      pair:
      - “
      - ”
    '#':
    - ＃
    - ⌘
    $:
    - ￥
    - $
    - €
    - £
    - ¥
    - ¢
    - ¤
    - ₩
    '%':
    - ％
    - °
    - ℃
    '&': ＆
    '''':
      pair:
      - ‘
      - ’
    (: （
    ): ）
    '*':
    - ＊
    - ·
    - ・
    - ×
    - ※
    - ❂
    +: ＋
    ',':
      commit: ，
    '-': －
    .:
      commit: 。
    /:
    - ／
    - ÷
    ':':
      commit: ：
    ;:
      commit: ；
    <:
    - 《
    - 〈
    - «
    - ‹
    '=':
    - ＝
    - 々
    - 〃
    '>':
    - 》
    - 〉
    - »
    - ›
    '?':
      commit: ？
    '@':
    - ＠
    - ☯
    '[':
    - 「
    - 【
    - 〔
    - ［
    - 〚
    - 〘
    \:
    - 、
    - ＼
    ']':
    - 」
    - 】
    - 〕
    - ］
    - 〛
    - 〙
    ^:
      commit: ……
    _: ——
    '`': ｀
    '{':
    - 『
    - 〖
    - ｛
    '|':
    - ·
    - ｜
    - §
    - ¦
    '}':
    - 』
    - 〗
    - ｝
    '~': ～
  key_binder/shijian_keys:
  - o
  switches/@5/reset: 1
  switches/@3/reset: 1
